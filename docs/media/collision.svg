    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">Segment collision / shared predicates</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Each consecutive point pair defines an independent segment.</text>
