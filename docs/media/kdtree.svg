<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Balanced k-d tree / spatial pruning">
    <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e7ebe1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24674d"/></marker></defs>
    <rect width="100%" height="100%" rx="18" fill="#f7f7ef"/>
    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">Balanced k-d tree / spatial pruning</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Near-side traversal tightens the best-distance bound.</text>
    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><rect x="60" y="110" width="365" height="230" fill="url(#grid)" stroke="#ccd6cc"/><path d="M235 110L235 340" stroke="#24674d" stroke-width="3" fill="none"/><path d="M60 225L235 225" stroke="#8f5b14" stroke-width="3" fill="none"/><path d="M235 195L425 195" stroke="#8f5b14" stroke-width="3" fill="none"/><rect x="235" y="110" width="190" height="85" fill="#f3ded6" stroke="#ab3e30" stroke-dasharray="7 5"/><circle cx="95" cy="280" r="6" fill="#395d6f"/><text x="106" y="270"></text><circle cx="180" cy="190" r="6" fill="#395d6f"/><text x="191" y="180"></text><circle cx="235" cy="245" r="6" fill="#395d6f"/><text x="246" y="235"></text><circle cx="320" cy="140" r="6" fill="#395d6f"/><text x="331" y="130"></text><circle cx="365" cy="270" r="6" fill="#395d6f"/><text x="376" y="260"></text><circle cx="135" cy="290" r="6" fill="#8f5b14"/><text x="146" y="280">query</text><rect x="490" y="115" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="144" font-weight="600">Alternate median axes</text><text x="506" y="170" font-size="15" fill="#52655c">x, then y, then x ...</text><rect x="490" y="215" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="244" font-weight="600">Use a box lower bound</text><text x="506" y="270" font-size="15" fill="#52655c">Prune only when no answer can improve</text></g></svg>