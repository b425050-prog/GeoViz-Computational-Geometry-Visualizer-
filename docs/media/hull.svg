<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Convex hull / monotone chain">
    <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e7ebe1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24674d"/></marker></defs>
    <rect width="100%" height="100%" rx="18" fill="#f7f7ef"/>
    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">Convex hull / monotone chain</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Build lower and upper chains; retain only the extreme boundary.</text>
    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><path d="M80 315H365V125H80Z" fill="#dcedde" stroke="#24674d" stroke-width="4"/><circle cx="80" cy="315" r="6" fill="#395d6f"/><text x="91" y="305">A</text><circle cx="365" cy="315" r="6" fill="#395d6f"/><text x="376" y="305">B</text><circle cx="365" cy="125" r="6" fill="#395d6f"/><text x="376" y="115">C</text><circle cx="80" cy="125" r="6" fill="#395d6f"/><text x="91" y="115">D</text><circle cx="200" cy="240" r="6" fill="#395d6f"/><text x="211" y="230">inside</text><circle cx="230" cy="315" r="6" fill="#395d6f"/><text x="241" y="305">collinear</text><rect x="470" y="125" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="486" y="154" font-weight="600">01  Sort coordinates</text><text x="486" y="180" font-size="15" fill="#52655c">Exact ordering, then deduplicate</text><rect x="470" y="225" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="486" y="254" font-weight="600">02  Keep left turns</text><text x="486" y="280" font-size="15" fill="#52655c">Pop the middle point on right / flat turns</text><text x="470" y="347">Interior and collinear side points are excluded.</text></g></svg>