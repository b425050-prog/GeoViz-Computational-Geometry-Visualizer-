<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Shortest paths / Dijkstra and A*">
    <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e7ebe1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24674d"/></marker></defs>
    <rect width="100%" height="100%" rx="18" fill="#f7f7ef"/>
    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">Shortest paths / Dijkstra and A*</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Shared relaxation and predecessor reconstruction; different ranking.</text>
    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><path d="M90 290L290 290" stroke="#24674d" stroke-width="3" fill="none"/><path d="M290 290L290 135" stroke="#24674d" stroke-width="3" fill="none"/><path d="M90 290L90 135" stroke="#abb7aa" stroke-width="3" fill="none"/><path d="M90 135L290 135" stroke="#abb7aa" stroke-width="3" fill="none"/><circle cx="90" cy="290" r="6" fill="#395d6f"/><text x="101" y="280">A / source</text><circle cx="290" cy="290" r="6" fill="#395d6f"/><text x="301" y="280">B</text><circle cx="90" cy="135" r="6" fill="#395d6f"/><text x="101" y="125">C</text><circle cx="290" cy="135" r="6" fill="#395d6f"/><text x="301" y="125">D / goal</text><text x="180" y="315">2</text><text x="310" y="215">2</text><text x="62" y="220">3</text><text x="180" y="120">2</text><rect x="470" y="110" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="486" y="139" font-weight="600">Relax an edge</text><text x="486" y="165" font-size="15" fill="#52655c">candidate = g[u] + weight(u,v)</text><rect x="470" y="210" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="486" y="239" font-weight="600">Choose the next vertex</text><text x="486" y="265" font-size="15" fill="#52655c">Dijkstra: g     A*: g + compatible h</text><text x="470" y="340">Both return A -> B -> D, optimal cost 4.</text></g></svg>