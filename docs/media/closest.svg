    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><rect x="205" y="110" width="85" height="230" fill="#e4eddf"/><path d="M250 100V355" stroke="#8f5b14" stroke-dasharray="7 5"/><circle cx="80" cy="300" r="6" fill="#395d6f"/><text x="91" y="290"></text><circle cx="140" cy="180" r="6" fill="#395d6f"/><text x="151" y="170"></text><circle cx="235" cy="230" r="6" fill="#395d6f"/><text x="246" y="220"></text><circle cx="254" cy="220" r="6" fill="#395d6f"/><text x="265" y="210"></text><circle cx="360" cy="145" r="6" fill="#395d6f"/><text x="371" y="135"></text><circle cx="400" cy="320" r="6" fill="#395d6f"/><text x="411" y="310"></text><path d="M235 230L254 220" stroke="#ab3e30" stroke-width="5" fill="none"/><rect x="490" y="115" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="144" font-weight="600">Divide and solve</text><text x="506" y="170" font-size="15" fill="#52655c">Remember the x split; solve both halves</text><rect x="490" y="215" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="244" font-weight="600">Merge vertical order</text><text x="506" y="270" font-size="15" fill="#52655c">Only a bounded strip can improve the best</text></g></svg>