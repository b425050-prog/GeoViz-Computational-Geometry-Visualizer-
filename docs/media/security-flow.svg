<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Security analysis / shared engine integration">
    <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e7ebe1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24674d"/></marker></defs>
    <rect width="100%" height="100%" rx="18" fill="#f7f7ef"/>
    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">Security analysis / shared engine integration</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Geography uses local metres; behaviour uses scaled rates.</text>
    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><rect x="25" y="110" width="250" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="41" y="139" font-weight="600">CSV records</text><text x="41" y="165" font-size="15" fill="#52655c">IDs, UTC, counts, locations</text><rect x="335" y="110" width="250" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="351" y="139" font-weight="600">Filter and transform</text><text x="351" y="165" font-size="15" fill="#52655c">One window; two unit systems</text><rect x="645" y="110" width="250" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="661" y="139" font-weight="600">Shared algorithms</text><text x="661" y="165" font-size="15" fill="#52655c">Fence, proximity and density</text><path d="M280 148H325M590 148H635" stroke="#24674d" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="245" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="41" y="274" font-weight="600">Source-linked observations</text><text x="41" y="300" font-size="15" fill="#52655c">One record or device aggregation</text><rect x="490" y="245" width="400" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="274" font-weight="600">Inspect and export evidence</text><text x="506" y="300" font-size="15" fill="#52655c">Truth labels and analyst verdicts stay separate</text></g></svg>