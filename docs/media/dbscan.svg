<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="DBSCAN / density connectivity">
    <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e7ebe1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#24674d"/></marker></defs>
    <rect width="100%" height="100%" rx="18" fill="#f7f7ef"/>
    <text x="30" y="40" font-family="Segoe UI,sans-serif" font-size="23" font-weight="600" fill="#273430">DBSCAN / density connectivity</text>
    <text x="30" y="68" font-family="Segoe UI,sans-serif" font-size="16" fill="#52655c">Core, border and noise use different shapes; radius 1.1, MinPts 3 in the worked example.</text>
    <g font-family="Segoe UI,sans-serif" font-size="17" fill="#273430"><circle cx="190" cy="235" r="85" fill="#e7f0f4" stroke="#8f5b14" stroke-dasharray="6 5"/><circle cx="150" cy="270" r="6" fill="#236a91"/><text x="161" y="260"></text><circle cx="220" cy="270" r="6" fill="#236a91"/><text x="231" y="260"></text><circle cx="150" cy="200" r="6" fill="#236a91"/><text x="161" y="190"></text><circle cx="220" cy="200" r="6" fill="#236a91"/><text x="231" y="190"></text><rect x="283" y="193" width="14" height="14" fill="none" stroke="#236a91" stroke-width="3"/><path d="M363 135L377 149" stroke="#ab3e30" stroke-width="3" fill="none"/><path d="M363 149L377 135" stroke="#ab3e30" stroke-width="3" fill="none"/><text x="105" y="315">A-D: core</text><text x="275" y="235">E: border</text><text x="340" y="117">F: noise</text><rect x="490" y="115" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="144" font-weight="600">Inclusive neighbourhood</text><text x="506" y="170" font-size="15" fill="#52655c">MinPts counts the point itself</text><rect x="490" y="215" width="370" height="76" rx="10" fill="white" stroke="#ccd6cc"/><text x="506" y="244" font-weight="600">Queue expansion</text><text x="506" y="270" font-size="15" fill="#52655c">A previous noise point may become border</text></g></svg>